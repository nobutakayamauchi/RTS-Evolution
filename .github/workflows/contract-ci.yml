name: Contract CI

on:
  pull_request:
  push:
    branches:
      - integration/ecosystem-reassembly-v1

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate interop contract invariants
        run: python tests/validate_contract.py
